<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch Website Metadata</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    async function extractColorsFromImage(imgSrc) {
      const loadImage = (src) => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'Anonymous';
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      };

      const extractColors = (img) => {
        const colorThief = new ColorThief();
        const dominantColor = colorThief.getColor(img);
        const hexColor = `#${((1 << 24) + (dominantColor[0] << 16) + (dominantColor[1] << 8) + dominantColor[2]).toString(16).slice(1).toUpperCase()}`;
        return { color: hexColor, 'c-color': getComplementaryColor(hexColor) };
      };

      try {
        const img = await loadImage(imgSrc);
        return extractColors(img);
      } catch (error) {
        console.error('Image loading failed:', error);
        return { color: "", 'c-color': "" };
      }
    }

    function getComplementaryColor(hex) {
      const r = 255 - parseInt(hex.slice(1, 3), 16);
      const g = 255 - parseInt(hex.slice(3, 5), 16);
      const b = 255 - parseInt(hex.slice(5, 7), 16);
      return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase()}`;
    }

    function getFaviconsAndOgImage(doc, baseUrl) {
      const faviconTags = [...doc.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]')];
      const ogImageTag = doc.querySelector('meta[property="og:image"]');

      const favicons = faviconTags.map(tag => resolveRelativeUrl(baseUrl, tag.href));
      const ogImage = ogImageTag ? resolveRelativeUrl(baseUrl, ogImageTag.content) : "";
      return { favicons, ogImage };
    }

    function resolveRelativeUrl(baseUrl, relativeUrl) {
      return new URL(relativeUrl, baseUrl).href;
    }

    async function fetchSiteData(siteUrl) {
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(siteUrl)}`;
      try {
        const response = await axios.get(proxyUrl);
        const parser = new DOMParser();
        const doc = parser.parseFromString(response.data, "text/html");

        const metadata = {
          title: doc.querySelector('title')?.innerText || "",
          description: doc.querySelector('meta[name="description"]')?.content || "",
          keywords: doc.querySelector('meta[name="keywords"]')?.content || "",
          language: doc.documentElement.lang || "",
        };

        const { favicons, ogImage } = getFaviconsAndOgImage(doc, siteUrl);
        metadata.favicons = favicons;
        metadata['og:image'] = ogImage;

        if (favicons.length > 0) {
          const colors = await extractColorsFromImage(favicons[0]);
          Object.assign(metadata, colors);
        }

        // Replace body content with JSON data
        document.body.innerText = JSON.stringify(metadata, null, 2);
      } catch (error) {
        document.body.innerText = JSON.stringify({ error: error.message }, null, 2);
      }
    }

    function run() {
      const urlParams = new URLSearchParams(window.location.search);
      const siteUrl = urlParams.get('url');
      if (siteUrl) {
        fetchSiteData(siteUrl);
      } else {
        document.body.innerText = JSON.stringify({ error: 'No URL parameter provided.' }, null, 2);
      }
    }

    window.onload = run;
  </script>
</head>
<body>
</body>
</html>
