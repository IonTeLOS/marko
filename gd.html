<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch Website Metadata and Colors</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>

  <h1>Website Metadata Fetcher</h1>
  <p>Fetching data for the site: <span id="site-url"></span></p>

  <div id="results">
    <h3>Results:</h3>
    <pre id="metadata"></pre>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function shouldFetchMetadata(key, getParams) {
      if (!getParams) return true;
      const getList = getParams.split(',');
      return getList.includes(key) || getList.includes(`${key}+`) || getList.includes(`${key}-`);
    }

    function getComplementaryColor(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const compR = 255 - r;
      const compG = 255 - g;
      const compB = 255 - b;
      return `#${((1 << 24) + (compR << 16) + (compG << 8) + compB).toString(16).slice(1).toUpperCase()}`;
    }

function extractColorsFromImage(imgSrc) {
  return new Promise((resolve, reject) => {
    const loadImage = (src) => {
      return new Promise((resolveImg, rejectImg) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous'; // Enable cross-origin if needed
        img.onload = () => resolveImg(img);
        img.onerror = (e) => {
          console.error('Image loading error:', e);
          rejectImg(e);
        };
        img.src = src;
      });
    };

    const extractColors = (img) => {
      const colorThief = new ColorThief();
      try {
        const dominantColor = colorThief.getColor(img);
        const hexColor = `#${((1 << 24) + (dominantColor[0] << 16) + (dominantColor[1] << 8) + dominantColor[2]).toString(16).slice(1).toUpperCase()}`;
        const complementaryColor = getComplementaryColor(hexColor);

        return { color: hexColor, 'c-color': complementaryColor };
      } catch (error) {
        console.error('Color extraction error:', error);
        return { color: "", 'c-color': "" };
      }
    };

    // Try to load image through proxy first
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(imgSrc)}`;
    loadImage(proxyUrl)
      .then(img => resolve(extractColors(img)))
      .catch(() => {
        console.warn('Failed to load image through proxy. Attempting direct load...');
        loadImage(imgSrc)
          .then(img => resolve(extractColors(img)))
          .catch(e => {
            console.error('Direct image loading error:', e);
            reject(e);
          });
      });
  });
}


    function resolveRelativeUrl(baseUrl, relativeUrl) {
      const urlObj = new URL(relativeUrl, baseUrl);
      return urlObj.href;
    }

    function getFavicons(doc, baseUrl) {
      const faviconTags = [...doc.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]')];
      if (faviconTags.length === 0) return { fav: "", 'fav-': "" };

      const faviconsWithSize = faviconTags.map(tag => {
        const size = tag.getAttribute('sizes');
        const width = size ? parseInt(size.split('x')[0], 10) : null;
        const href = resolveRelativeUrl(baseUrl, tag.getAttribute('href'));
        return { href, size: width || 0 };
      }).sort((a, b) => b.size - a.size);

      if (faviconsWithSize.length === 1) {
        return { fav: faviconsWithSize[0].href };
      } else {
        return {
          'fav+': faviconsWithSize[0].href,
          'fav-': faviconsWithSize[faviconsWithSize.length - 1].href
        };
      }
    }

    async function fetchSiteData(siteUrl, getParams) {
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(siteUrl)}`;
      try {
        const response = await axios.get(proxyUrl);
        const parser = new DOMParser();
        const doc = parser.parseFromString(response.data, "text/html");

        const metadata = {};

        if (shouldFetchMetadata('title', getParams)) {
          metadata.title = doc.querySelector('title')?.innerText || "";
        }
        if (shouldFetchMetadata('shortname', getParams)) {
          metadata.shortname = siteUrl.replace(/https?:\/\//, '').split('/')[0] || "";
        }
        if (shouldFetchMetadata('description', getParams)) {
          metadata.description = doc.querySelector('meta[name="description"]')?.content || "";
        }
        if (shouldFetchMetadata('keywords', getParams)) {
          metadata.keywords = doc.querySelector('meta[name="keywords"]')?.content || "";
        }
        if (shouldFetchMetadata('language', getParams)) {
          metadata.language = doc.documentElement.lang || "";
        }
        if (shouldFetchMetadata('fav', getParams)) {
          Object.assign(metadata, getFavicons(doc, siteUrl));
        }
        if (shouldFetchMetadata('ogImage', getParams)) {
          let ogImage = doc.querySelector('meta[property="og:image"]')?.content || "";
          if (ogImage && !ogImage.startsWith('http')) {
            ogImage = resolveRelativeUrl(siteUrl, ogImage);
          }
          if (ogImage.startsWith('$')) {
            const varName = ogImage.substring(1);
            const scriptTags = doc.getElementsByTagName('script');
            for (let script of scriptTags) {
              const match = script.textContent.match(new RegExp(`${varName}\\s*=\\s*["'](.+?)["']`));
              if (match) {
                ogImage = match[1];
                break;
              }
            }
          }
          metadata.ogImage = ogImage;
        }

        if (shouldFetchMetadata('color', getParams)) {
          const imgUrl = metadata.ogImage || metadata['fav+'] || metadata.fav;
          if (imgUrl) {
            try {
              const colors = await extractColorsFromImage(imgUrl);
              Object.assign(metadata, colors);
            } catch (error) {
              console.error('Error extracting colors:', error);
              metadata.color = "";
              metadata['c-color'] = "";
            }
          } else {
            console.warn('No image URL found for color extraction.');
            metadata.color = "";
            metadata['c-color'] = "";
          }
        }

        document.getElementById('metadata').innerText = JSON.stringify(metadata, null, 2);
      } catch (error) {
        console.error('Error fetching site data:', error);
        document.getElementById('metadata').innerText = `Error: ${error.message}`;
      }
    }

    function run() {
      const siteUrl = getQueryParam('url');
      const getParams = getQueryParam('get');
      if (siteUrl) {
        document.getElementById('site-url').innerText = siteUrl;
        fetchSiteData(siteUrl, getParams);
      } else {
        console.error('No URL parameter provided.');
      }
    }

    window.onload = run;
  </script>
</body>
</html>
