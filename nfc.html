<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Link Sharing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:disabled {
            background-color: #ccc;
        }
        #deviceList {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Bluetooth Link Sharing</h1>
    <input type="text" id="urlInput" placeholder="Enter URL" />
    <button id="shareButton" disabled>Share via Bluetooth</button>

    <div id="deviceList"></div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const shareButton = document.getElementById('shareButton');
        const deviceListDiv = document.getElementById('deviceList');

        let selectedDevice;

        urlInput.addEventListener('input', () => {
            shareButton.disabled = urlInput.value.trim() === '' || !selectedDevice;
        });

        shareButton.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            try {
                const server = await selectedDevice.gatt.connect();
                const service = await server.getPrimaryService('battery_service');
                const characteristic = await service.getCharacteristic('battery_level');

                const encoder = new TextEncoder('utf-8');
                const data = encoder.encode(url);

                // Assume you have a custom characteristic to send the URL
                await characteristic.writeValue(data);
                
                alert('URL shared via Bluetooth!');
            } catch (error) {
                console.error('Error sharing URL:', error);
                alert('Failed to share URL. Make sure Bluetooth is enabled on both devices.');
            }
        });

        async function listAvailableDevices() {
            try {
                const devices = await navigator.bluetooth.getDevices();
                deviceListDiv.innerHTML = '';

                devices.forEach(device => {
                    const deviceButton = document.createElement('button');
                    deviceButton.textContent = device.name || 'Unnamed Device';
                    deviceButton.onclick = () => {
                        selectedDevice = device;
                        deviceListDiv.innerHTML = `<p>Selected Device: ${device.name}</p>`;
                        shareButton.disabled = urlInput.value.trim() === '';
                    };
                    deviceListDiv.appendChild(deviceButton);
                });
                
                if (devices.length === 0) {
                    deviceListDiv.innerHTML = '<p>No devices found.</p>';
                }
            } catch (error) {
                console.error('Error listing devices:', error);
                deviceListDiv.innerHTML = '<p>Failed to list devices. Make sure Bluetooth is enabled.</p>';
            }
        }

        // Call the function to list available devices
        listAvailableDevices();
    </script>
</body>
</html>
