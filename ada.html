<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paywall Protected Content</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #premium-content {
            display: none;
            margin-top: 20px;
        }
        #paywall {
            display: none;
            margin-top: 20px;
        }
        .button {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h1>Welcome to Our Premium Content</h1>

<div id="paywall">
    <h2>Subscribe to Access</h2>
    <p>This content is for subscribers only. Please choose a subscription to continue.</p>
    <button class="button" onclick="handleSubscription()">Subscribe Now</button>
</div>

<div id="premium-content">
    <h2>Premium Content</h2>
    <iframe src="https://example.com" width="100%" height="500px"></iframe>
</div>

<script>
    const yourApiKey = '38cf0b4d-221c-48c2-98f3-3db332bd6b0f';  // Replace with your actual Adapty API key
    let userId = localStorage.getItem('user_id');
if (!userId) {
    userId = generateUUID();  // Generate a new UUID for the user
    localStorage.setItem('user_id', userId);
}

function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

    async function identifyUser() {
        const response = await fetch('https://api.adapty.io/api/v1/sdk/analytics/profiles/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `ApiKey ${yourApiKey}`,
            },
            body: JSON.stringify({ profile_id: userId })
        });
        return await response.json();
    }

    async function fetchProducts() {
        const response = await fetch('https://api.adapty.io/api/v1/sdk/in-apps/products/', {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `ApiKey ${yourApiKey}`,
            },
        });
        return await response.json();
    }

    async function validatePurchase(receipt) {
        const response = await fetch('https://api.adapty.io/api/v1/sdk/in-apps/validate/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `ApiKey ${yourApiKey}`,
            },
            body: JSON.stringify({ receipt: receipt })
        });
        return await response.json();
    }

    async function checkSubscriptionStatus() {
        const response = await fetch(`https://api.adapty.io/api/v1/sdk/subscriptions/${userId}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `ApiKey ${yourApiKey}`,
            },
        });
        return await response.json();
    }

    async function protectContent() {
        const subscriptionStatus = await checkSubscriptionStatus();
        if (subscriptionStatus.data.subscriptions[0].is_active) {
            document.getElementById('premium-content').style.display = 'block';
        } else {
            document.getElementById('paywall').style.display = 'block';
        }
    }

    async function handleSubscription() {
        const products = await fetchProducts();
        // Here you would normally integrate a payment gateway or handle the subscription process.
        // For now, let's assume a successful purchase and validate it.
        const receipt = 'dummy_receipt';  // Replace with actual receipt from the payment gateway
        const validation = await validatePurchase(receipt);
        if (validation.success) {
            protectContent();  // Re-check subscription status after purchase
        } else {
            alert('Subscription failed. Please try again.');
        }
    }

    // Run when the page loads
    document.addEventListener('DOMContentLoaded', async function() {
        await identifyUser();  // Identify the user
        protectContent();  // Check subscription status and protect content
    });
</script>

</body>
</html>
