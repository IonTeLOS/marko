<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notify.pchat.xyz Proof of Concept</title>
  <link rel="manifest" href="/manifest.json">
      <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/IonTeLOS/marko/main/triskelion.svg">

</head>
<body>
  <h1>notify.pchat.xyz Proof of Concept</h1>
  <form id="subscription-form">
    <label for="topic">Subscribe to Topic:</label>
    <input type="text" id="topic" placeholder="Enter topic name" required>
    <button type="submit">Subscribe</button>
  </form>
  <br>
  <form id="message-form">
    <label for="message">Send Message:</label>
    <input type="text" id="message" placeholder="Enter message" required>
    <button type="submit">Send</button>
  </form>
  <div id="events"></div>

  <script>
        const events = document.getElementById('events');

    // Register the service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
      .then(function(registration) {
        console.log('Service Worker registered with scope:', registration.scope);
      }).catch(function(error) {
        console.error('Service Worker registration failed:', error);
      });
    }
    
if (Notification.permission !== 'granted') {
  Notification.requestPermission().then(permission => {
    console.log('Notification permission:', permission);
  });
}

    // Handle subscription form
    document.getElementById('subscription-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const topic = document.getElementById('topic').value;
      subscribeToTopic(topic);
    });

    // Handle message form
    document.getElementById('message-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const topic = document.getElementById('topic').value;
      const message = document.getElementById('message').value;
      sendMessage(topic, message);
    });

async function subscribeToTopic(topic) {
  try {
    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array('BDOTx2Mh_mTI5DL0hrTMVEj0xaUI_no1CNPZk2V1P2Hq8rQeImMOkqek5JQH5CPjZp62ELAy2ArDG5A-Y9oquxw')
    });
    
    // Send subscription to notify.pchat.xyz
    const response = await fetch(`https://notify.pchat.xyz/${topic}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        action: 'subscribe',
        topic: topic,
        endpoint: subscription.endpoint,
        key: btoa(String.fromCharCode.apply(null, new Uint8Array(subscription.getKey('p256dh')))),
        auth: btoa(String.fromCharCode.apply(null, new Uint8Array(subscription.getKey('auth'))))
      })
    });
    
    if (response.ok) {
      console.log('Subscribed successfully');
    } else {
      console.error('Subscription failed');
    }
  } catch (error) {
    console.error('Subscription error:', error);
  }
  const socket = new WebSocket(`wss://notify.pchat.xyz/${topic}/ws`);
      const websocket =  new WebSocket(`wss://notify.pchat.xyz/${topic}/ws`);

socket.addEventListener('message', function (event) {
    console.log(event.data);
      websocket.onmessage = (e) => {
        let event = document.createElement('div');
        event.innerHTML = e.data;
        events.appendChild(event);
      };
});
}
async function subscribeToPush() {
  try {
    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array('BDOTx2Mh_mTI5DL0hrTMVEj0xaUI_no1CNPZk2V1P2Hq8rQeImMOkqek5JQH5CPjZp62ELAy2ArDG5A-Y9oquxw')
    });
    console.log('Push subscription:', subscription);
    console.log('Endpoint:', subscription.endpoint);

  } catch (error) {
    console.error('Push subscription error:', error);
  }
}


    async function sendMessage(topic, message) {
      try {
        const response = await fetch(`https://notify.pchat.xyz/${topic}`, {
          method: 'POST',
          body: message
        });
        if (response.ok) {
          console.log('Message sent');
        } else {
          console.error('Message sending failed');
        }
      } catch (error) {
        console.error('Message sending error:', error);
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/\-/g, '+')
        .replace(/\_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }
    subscribeToPush();
  </script>
</body>
</html>
