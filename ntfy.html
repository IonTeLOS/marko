<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ntfy.sh Proof of Concept</title>
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <h1>ntfy.sh Proof of Concept</h1>
  <form id="subscription-form">
    <label for="topic">Subscribe to Topic:</label>
    <input type="text" id="topic" placeholder="Enter topic name" required>
    <button type="submit">Subscribe</button>
  </form>
  <br>
  <form id="message-form">
    <label for="message">Send Message:</label>
    <input type="text" id="message" placeholder="Enter message" required>
    <button type="submit">Send</button>
  </form>
  <script>
    // Register the service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/marko/service-worker.js')
      .then(function(registration) {
        console.log('Service Worker registered with scope:', registration.scope);
      }).catch(function(error) {
        console.error('Service Worker registration failed:', error);
      });
    }

    // Handle subscription form
    document.getElementById('subscription-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const topic = document.getElementById('topic').value;
      subscribeToTopic(topic);
    });

    // Handle message form
    document.getElementById('message-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const topic = document.getElementById('topic').value;
      const message = document.getElementById('message').value;
      sendMessage(topic, message);
    });

    async function subscribeToTopic(topic) {
      try {
        const registration = await navigator.serviceWorker.ready;
        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array('YOUR_PUBLIC_VAPID_KEY')
        });

        // Send subscription to ntfy.sh
        const response = await fetch(`https://ntfy.sh/${topic}/subscribe`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            subscription: subscription
          })
        });
        const result = await response.json();
        console.log('Subscription result:', result);
      } catch (error) {
        console.error('Subscription error:', error);
      }
    }

    async function sendMessage(topic, message) {
      try {
        const response = await fetch(`https://ntfy.sh/${topic}`, {
          method: 'POST',
          body: message
        });
        if (response.ok) {
          console.log('Message sent');
        } else {
          console.error('Message sending failed');
        }
      } catch (error) {
        console.error('Message sending error:', error);
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/\-/g, '+')
        .replace(/\_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }
  </script>
</body>
</html>
