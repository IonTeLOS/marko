<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation with Nominatim and Google Maps Link</title>
</head>
<body>
    <h3>Your Nearest Address:</h3>
    <p id="address">Fetching location...</p>
    <p id="mapLink"></p> <!-- Link to Google Maps will appear here -->

    <script>
        // Check if Geolocation is supported
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(successCallback, errorCallback);
        } else {
            document.getElementById('address').innerText = 'Geolocation is not supported by your browser.';
        }

        function successCallback(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            // Use Nominatim to reverse geocode the coordinates to an address
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const address = data.display_name;
                    document.getElementById('address').innerText = address;

                    // Create a Google Maps search link
                    const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
                    
                    // Display the link
                    const mapLinkElement = document.getElementById('mapLink');
                    mapLinkElement.innerHTML = `<a href="${googleMapsUrl}" target="_blank">View in Google Maps</a>`;
                })
                .catch(error => {
                    console.error('Error fetching address:', error);
                    document.getElementById('address').innerText = 'Unable to retrieve address.';
                });
        }

        function errorCallback(error) {
            console.error('Error getting location: ' + error.message);
            document.getElementById('address').innerText = 'Error fetching location.';
        }
    </script>
</body>
</html>
