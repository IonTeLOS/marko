<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Link Generator</title>
</head>
<body>
    <button id="getLocation">Get Location</button>
    <p id="mapsLink"></p>

    <script>
        const IPWHOIS_API_URL = 'https://ipwho.is/';

        function getMapsLink(query) {
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
        }

        function isMobile() {
            return /Mobi|Android/i.test(navigator.userAgent);
        }

        function getLocation() {
            if (isMobile()) {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(successCallback, errorCallback);
                } else {
                    alert('Geolocation is not supported by your browser.');
                }
            } else {
                fetch(IPWHOIS_API_URL)
                    .then(response => response.json())
                    .then(data => {
                        const { city, region, country } = data;
                        const closestLocation = `${city}, ${region}, ${country}`;
                        document.getElementById('mapsLink').innerHTML = `<a href="${getMapsLink(closestLocation)}" target="_blank">View Closest Location in Google Maps</a>`;
                    })
                    .catch(error => {
                        console.error('Error fetching IP-based location:', error);
                        alert('Unable to retrieve location.');
                    });
            }
        }

        function successCallback(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            // Use Nominatim to reverse geocode the coordinates to an address
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const address = data.display_name;
                    document.getElementById('mapsLink').innerHTML = `<a href="${getMapsLink(address)}" target="_blank">View Your Location in Google Maps</a>`;
                })
                .catch(error => {
                    console.error('Error fetching address:', error);
                    alert('Unable to retrieve address.');
                });
        }

        function errorCallback(error) {
            console.error('Error getting location: ' + error.message);
            alert('Error fetching location.');
        }

        document.getElementById('getLocation').addEventListener('click', getLocation);
    </script>
</body>
</html>
