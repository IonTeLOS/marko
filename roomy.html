function showMessageTypeIcon(iconName, url) {
  const iconElement = document.getElementById('messageTypeIcon');
  
  // Remove the 'hidden' class to make the icon visible
  iconElement.classList.remove('hidden');
  
  // Update the icon's content to match the provided icon name
  iconElement.textContent = iconName;

  // If a URL is provided, add a click event to open the URL
  if (url) {
    iconElement.style.cursor = 'pointer'; // Change cursor to indicate it's clickable
    iconElement.onclick = function() {
    window.open(url, '_blank'); // Open URL in a new tab
    };
  } else {
    iconElement.style.cursor = ''; // Reset cursor if no URL is provided
    iconElement.onclick = null; // Remove any previous click handler
  }
}

        function getMapsLink(query) {
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
        }

        function isGPSAvailable() {
            return new Promise((resolve) => {
                if ('geolocation' in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            // Check if the position has high accuracy
                            if (position.coords.accuracy <= 100) { // Accuracy is in meters
                                resolve(true);
                            } else {
                                resolve(false);
                            }
                        },
                        () => resolve(false),
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                } else {
                    resolve(false);
                }
            });
        }

        async function getLocation() {
            const gpsAvailable = await isGPSAvailable();
            
            if (gpsAvailable) {
                const allowExactLocation = confirm('GPS is available. Do you allow exact location?');
                
                if (allowExactLocation) {
                    navigator.geolocation.getCurrentPosition(successCallback, errorCallback, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    });
                } else {
                    fetchIPBasedLocation();
                }
            } else {
                console.log("GPS is not available or not accurate enough. Using IP-based location.");
                fetchIPBasedLocation();
            }
        }

        function fetchIPBasedLocation() {
            fetch(IPWHOIS_API_URL)
                .then(response => response.json())
                .then(data => {
                    const { city, region, country } = data;
                    const closestLocation = `${city}, ${region}, ${country}`;
		    const mapLink = getMapsLink(closestLocation);
		    showMessageTypeIcon('location_on', mapLink);	
		    sessionStorage.setItem('current-location', mapLink);
                    //document.getElementById('mapsLink').innerHTML = `<a href="${getMapsLink(closestLocation)}" target="_blank" class="map-marker"><i class="material-icons">place</i> View Closest Location in Google Maps</a>`;
                })
                .catch(error => {
                    console.error('Error fetching IP-based location:', error);
                    alert('Unable to retrieve location.');
                });
        }

        function successCallback(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            // Use Nominatim to reverse geocode the coordinates to an address
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const address = data.display_name;
                    //document.getElementById('mapsLink').innerHTML = `<a href="${getMapsLink(address)}" target="_blank" class="map-marker"><i class="material-icons">place</i> View Your Location in Google Maps</a>`;
		    const mapLink = getMapsLink(address);
		    showMessageTypeIcon('location_on', mapLink);	
		    sessionStorage.setItem('current-location', mapLink);
                })
                .catch(error => {
                    console.error('Error fetching address:', error);
                    alert('Unable to retrieve address.');
                });
        }

        function errorCallback(error) {
            console.error('Error getting location: ' + error.message);
            fetchIPBasedLocation();
        }




// Ensure EmojiMart is imported and available
if (typeof EmojiMart === 'undefined') {
  console.error('EmojiMart library is not loaded.');
} else {
  // Create a div container for the picker (hidden by default)
  const pickerContainer = document.getElementById('pickerContainer');
  if (pickerContainer) {

  } else {

            sessionStorage.setItem('effect-adding', emoji.native);

	}
      } else {
        console.error('Message input element not found.');
      }

  };

  // Initialize the picker
  try {
    const picker = new EmojiMart.Picker(pickerOptions);
    if (pickerContainer) {
      pickerContainer.appendChild(picker);
    }
  } catch (error) {
    console.error('Error initializing the emoji picker:', error);
  }

  // Function to toggle the picker visibility
  function toggleEmojiPicker() {
    if (pickerContainer.style.display === 'none') {

    } else {
      pickerContainer.style.display = 'none'; // Hide picker
    }
  }

    pickerContainer.style.display = 'none';

      hideEmojiPicker();

let mainLink = '';  // Global variable to store the main link

function addLink(providedLink) {
    clearLink();
    // Function to check if the URL is a photo
    function isPhotoUrl(url) {
        return /\.(jpg|jpeg|png|gif|bmp)(\?[^\s]*)?$/i.test(url);
    }
	
    // Check if providedLink is not blank, null, or undefined
    if (typeof providedLink === 'string' && providedLink.trim() !== '') {
        mainLink = providedLink.trim();
	// Use the provided link
       	showMessageTypeIcon('link', mainLink);
        sessionStorage.setItem('main-link', mainLink);
        // Check if the link is a photo
        if (isPhotoUrl(mainLink)) {
            showMessageTypeIcon('photo', mainLink);
            sessionStorage.setItem('main-photo', mainLink);
        } 
        return;  // Exit the function after processing the provided link
    }

    // Continue with checking the input field if no providedLink
    const messageInput = document.getElementById('messageInput');
    let inputValue = messageInput.value.trim();
    const urlPattern = /([a-zA-Z]+:\/\/[^\s]+)/gi;  // Regular expression to detect any protocol link
	
    if (urlPattern.test(inputValue)) {
        const foundLink = inputValue.match(urlPattern)[0];  // Extract the first URL found
        const confirmLinkification = confirm(`Do you want to turn "${foundLink}" into a link?`);
        
        if (confirmLinkification) {
	    mainLink = foundLink;
            showMessageTypeIcon('link', mainLink);
            sessionStorage.setItem('main-link', mainLink);
            // Check if the link is a photo
            if (isPhotoUrl(mainLink)) {
                showMessageTypeIcon('photo', mainLink);
                sessionStorage.setItem('main-photo', foundLink);
            }
        }
    } else {
        const enteredLink = prompt("No link found. Please enter a link:");
        
        if (enteredLink && urlPattern.test(enteredLink)) {
            mainLink = enteredLink.trim();
	    showMessageTypeIcon('link', mainLink);
            sessionStorage.setItem('main-link', mainLink);
            // Check if the link is a photo
            if (isPhotoUrl(mainLink)) {
                showMessageTypeIcon('photo', mainLink);
                sessionStorage.setItem('main-photo', mainLink);
	    }
        } else {
            alert('Invalid link entered.');
        }
    }
}

	  // Function to generate a UUID (version 4)
function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

// Function to create a conference link and add it
function addConference() {
    const uuid = generateUUID();
    const conferenceLink = `https://pchat.xyz/public/${uuid}`;
    
    mainLink = conferenceLink;

    // Use the updated addLink function to handle the link
    addLink(mainLink);

    // Show the Material icon for video chat
    showMessageTypeIcon('video_chat', conferenceLink);
    sessionStorage.setItem('main-link', conferenceLink);
}



	  
let rooms = JSON.parse(localStorage.getItem('rooms')) || [];

function openDropdown() {
  const dropdown = document.querySelector('.dropdown');
  const dropdownMenu = dropdown.querySelector('.dropdown-menu'); // Define dropdownMenu here
  
  dropdown.classList.toggle('show');
  
  if (dropdown.classList.contains('show')) {
    dropdownMenu.style.maxHeight = dropdownMenu.scrollHeight + "px"; // Open the dropdown
  } else {
    dropdownMenu.style.maxHeight = null; // Close the dropdown
  }
}


// Close dropdown when clicking outside
function closeDropdown(event) {
  const dropdown = document.querySelector('.dropdown');
  const topMenuButton = document.querySelector('.material-icons[onclick="openDropdown()"]'); // Dropdown opener button
  
  if (!dropdown.contains(event.target) && event.target !== topMenuButton) {
    dropdown.classList.remove('show');
    const dropdownMenu = dropdown.querySelector('.dropdown-menu');
    dropdownMenu.style.maxHeight = null;
  }
}

// Add click event listener for closing dropdown
document.addEventListener('click', closeDropdown);

// Render rooms in dropdown
function renderRooms() {
  const dropdownMenu = document.querySelector('.dropdown-menu');
  dropdownMenu.innerHTML = '';

  rooms.sort((a, b) => {
    if (a.color === 'green') return -1;
    if (b.color === 'green') return 1;
    return (b.messageCount || 0) - (a.messageCount || 0);
  });

  rooms.forEach((room, index) => {
    const roomChip = document.createElement('div');
    roomChip.classList.add('room-chip', room.color);
    roomChip.innerHTML = `
      <span class="dot"></span>
      <span class="room-name">${room.name}</span>
      <span class="material-icons delete-btn" onclick="event.stopPropagation(); deleteRoom(${index})">delete</span>
    `;
    roomChip.addEventListener('click', () => openRoom(room.id));
    dropdownMenu.appendChild(roomChip);
  });
}

// Open a room
function openRoom(roomId) {
  const room = rooms.find(r => r.id === roomId);
  const topic = room ? room.topic : 'No topic';
  alert(`Room "${room.name}" with topic "${topic}" opened`);
  console.log('Open room:', roomId);

  // Close dropdown
  const dropdown = document.querySelector('.dropdown');
  dropdown.classList.remove('show');
  const dropdownMenu = dropdown.querySelector('.dropdown-menu');
  dropdownMenu.style.maxHeight = null;
}

    function addRoomFromUrlParams() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('addRoom') === 'true') {
        const roomTopic = urlParams.get('roomTopic');
        const roomName = urlParams.get('roomName');
        const roomKey = urlParams.get('roomKey');
        const roomExtras = urlParams.get('roomExtras');

        if (roomTopic && roomKey) {
          const newRoom = {
            id: Date.now(),
            topic: roomTopic,
            name: roomName,
            key: roomKey,
            extras: roomExtras || '',
            color: 'blue'
          };

          if (confirm(`Add room: ${roomName}?`)) {
            rooms.push(newRoom);
            localStorage.setItem('rooms', JSON.stringify(rooms));
            renderRooms();
          }
        }
      }
    }

    function deleteRoom(index) {
      if (confirm('Are you sure you want to delete this room?')) {
        rooms.splice(index, 1);
        localStorage.setItem('rooms', JSON.stringify(rooms));
        renderRooms();
      }
    }

        const iconButton = document.getElementById('multiButton');

        if (inputText === '') {
            iconButton.textContent = 'content_paste'; // Show paste icon
            iconButton.onclick = pasteFromClipboard; // Set click handler to paste text
        } else {
            iconButton.textContent = 'clear'; // Show clear icon
            iconButton.onclick = clearText; // Set click handler to clear text
        }
    }

    // Function to paste text from clipboard into the input field
    async function pasteFromClipboard() {
        try {
            const clipboardText = await navigator.clipboard.readText();
            const inputField = document.getElementById('messageInput');
            inputField.value = clipboardText;
            updateMultiButton(); // Update the icon after pasting
        } catch (err) {
            console.error('Failed to read clipboard contents: ', err);
        }
    }

    // Function to clear the input field
    function clearText() {
        const inputField = document.getElementById('messageInput');
        inputField.value = ''; // Clear the input field
        updateMultiButton(); // Update the icon after clearing
    }
// Close top-row when clicking outside
document.addEventListener('click', function(event) {
  const topRow = document.querySelector('.top-row');
  const chatInput = document.querySelector('.chat-input-wrapper');
  
  if (!chatInput.contains(event.target) && !topRow.contains(event.target) && topRow.classList.contains('open')) {
    topRow.classList.remove('open');
  }
});

        document.getElementById('getLocation').addEventListener('click', getLocation);
        document.getElementById('linkify').addEventListener('click', addLink);
	document.getElementById('addEffect').addEventListener('click', addEmojiEffect);
    
// Add event listeners for input changes and button clicks
    document.addEventListener('DOMContentLoaded', () => {
        const inputField = document.getElementById('messageInput');
        const sendMessageButton = document.getElementById('sendMessageButton');

        if (inputField) {
            // Attach event listeners to handle input and blur events
            inputField.addEventListener('input', updateMultiButton);
            inputField.addEventListener('blur', updateMultiButton);
        }

        if (sendMessageButton) {
            sendMessageButton.addEventListener('click', sendMessage);
        }

        // Initial state of the icon button when the page loads
        updateMultiButton();
    });

    addRoomFromUrlParams();
    renderRooms();
