<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimized Chat App</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  background-color: #f4f4f4;
}

.dropdown {
  width: 100%;
}

.dropdown-toggle {
  width: 100%;
  background-color: #2196F3;
  color: white;
  padding: 16px;
  font-size: 18px;
  text-align: center;
  cursor: pointer;
  border: none;
}

.dropdown-menu {
  width: 100%;
  max-height: 0;
  overflow: hidden;
  background-color: white;
  box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
  transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
  opacity: 0;
}

.dropdown.show .dropdown-menu {
  max-height: 50vh;
  opacity: 1;
}

.room-chip {
  display: flex;
  align-items: center;
  padding: 12px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.room-chip:hover {
  background-color: #f1f1f1;
}

.room-chip .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  margin-right: 12px;
}

.room-chip .room-name {
  flex-grow: 1;
}

.room-chip .delete-btn {
  color: red;
  cursor: pointer;
}

.room-chip.blue .dot { background-color: blue; }
.room-chip.green .dot { background-color: green; }
.room-chip.orange .dot { background-color: orange; }
.room-chip.red .dot { background-color: red; }

.chat-container {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 20px;
}

.input-container {
  background-color: white;
  border-top: 1px solid #ddd;
  padding: 10px;
}

.top-row {
  display: flex;
  justify-content: space-around;
  padding: 10px;
  background-color: #f8f8f8;
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
}

.top-row .material-icons {
  font-size: 28px;
  color: #2196F3;
  cursor: pointer;
}

.chat-input-wrapper {
  display: flex;
  align-items: center;
  padding: 10px;
  background-color: #f8f8f8;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
}

.chat-input {
  position: relative;
  display: flex;
  align-items: center;
  flex-grow: 1;
  padding: 10px;
  border-radius: 20px;
  border: 1px solid #2196F3;
  background-color: white;
  height: 50px;
}

.chat-input input {
  position: relative;
  z-index: 2;
  flex-grow: 1;
  border: none;
  outline: none;
  font-size: 16px;
  margin: 0 10px;
  background-color: transparent;
  caret-color: black; /* Ensure the cursor is visible */
  color: transparent; /* Keep text invisible */
  line-height: 1.5; /* Match rendered text */
  height: 100%;
  padding: 0; /* No initial padding */
  padding-left: 0; /* Will be dynamically adjusted */
}

.chat-input input::placeholder {
  color: #ccc;
}

.rendered-markdown {
  position: absolute;
  top: 50%; 
  left: 15px;
  width: auto; /* Allow width to adjust to content */
  transform: translateY(-50%);
  font-size: 16px;
  line-height: 1.5; /* Match input line-height */
  color: black;
  pointer-events: none;
  white-space: pre-wrap;
}

.clear-btn {
  z-index: 3;
}

/* Wrapper for input and markdown rendering */
.input-overlay-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
}

.chat-input .material-icons {
  color: #2196F3;
  cursor: pointer;
  font-size: 28px;
}

.chat-input .clear-btn {
  margin-right: 15px;
}

.bottom-menu {
  display: flex;
  justify-content: space-around;
  padding: 15px;
  background-color: #f8f8f8;
  border-top: 1px solid #ddd;
}

.bottom-menu .material-icons {
  font-size: 32px;
  color: #2196F3;
  cursor: pointer;
}
      /* Style for the picker container to center it on the screen */
  #pickerContainer {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1000;
    box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1); /* Optional shadow for emphasis */
  }
  #mapsLink a {
    display: inline-block;
    padding: 10px;
    text-decoration: none;
  }
  .map-marker {
    font-size: 24px;
    color: #FF5722; /* Orange color for marker */
  }
        @media (max-width: 767px) {
        .desktop-only {
          display: none;
        }
      }
  </style>

  <script>
        const IPWHOIS_API_URL = 'https://ipwho.is/';

        function getMapsLink(query) {
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
        }

        function isGPSAvailable() {
            return new Promise((resolve) => {
                if ('geolocation' in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            // Check if the position has high accuracy
                            if (position.coords.accuracy <= 100) { // Accuracy is in meters
                                resolve(true);
                            } else {
                                resolve(false);
                            }
                        },
                        () => resolve(false),
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                } else {
                    resolve(false);
                }
            });
        }

        async function getLocation() {
            const gpsAvailable = await isGPSAvailable();
            
            if (gpsAvailable) {
                const allowExactLocation = confirm('GPS is available. Do you allow exact location?');
                
                if (allowExactLocation) {
                    navigator.geolocation.getCurrentPosition(successCallback, errorCallback, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    });
                } else {
                    fetchIPBasedLocation();
                }
            } else {
                console.log("GPS is not available or not accurate enough. Using IP-based location.");
                fetchIPBasedLocation();
            }
        }

        function fetchIPBasedLocation() {
            fetch(IPWHOIS_API_URL)
                .then(response => response.json())
                .then(data => {
                    const { city, region, country } = data;
                    const closestLocation = `${city}, ${region}, ${country}`;
                    document.getElementById('mapsLink').innerHTML = `<a href="${getMapsLink(closestLocation)}" target="_blank" class="map-marker"><i class="material-icons">place</i> View Closest Location in Google Maps</a>`;
                })
                .catch(error => {
                    console.error('Error fetching IP-based location:', error);
                    alert('Unable to retrieve location.');
                });
        }

        function successCallback(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            // Use Nominatim to reverse geocode the coordinates to an address
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const address = data.display_name;
                    document.getElementById('mapsLink').innerHTML = `<a href="${getMapsLink(address)}" target="_blank" class="map-marker"><i class="material-icons">place</i> View Your Location in Google Maps</a>`;
                })
                .catch(error => {
                    console.error('Error fetching address:', error);
                    alert('Unable to retrieve address.');
                });
        }

        function errorCallback(error) {
            console.error('Error getting location: ' + error.message);
            fetchIPBasedLocation();
        }

        document.getElementById('getLocation').addEventListener('click', getLocation);
   

// Ensure EmojiMart is imported and available
if (typeof EmojiMart === 'undefined') {
  console.error('EmojiMart library is not loaded.');
} else {
  // Create a div container for the picker (hidden by default)
  const pickerContainer = document.getElementById('pickerContainer');
  if (pickerContainer) {
    pickerContainer.style.display = 'none'; // Hidden initially
    document.body.appendChild(pickerContainer);
  } else {
    console.error('Picker container element not found.');
  }

  // Define the picker options
  const pickerOptions = {
    onEmojiSelect: (emoji) => {
      const messageInput = document.getElementById('messageInput');
      if (messageInput) {
        // Insert the selected emoji into the text input
        messageInput.value += emoji.native; // 'emoji.native' contains the emoji character
      } else {
        console.error('Message input element not found.');
      }
    },
  };

  // Initialize the picker
  try {
    const picker = new EmojiMart.Picker(pickerOptions);
    if (pickerContainer) {
      pickerContainer.appendChild(picker);
    }
  } catch (error) {
    console.error('Error initializing the emoji picker:', error);
  }

  // Function to toggle the picker visibility
  function toggleEmojiPicker() {
    if (pickerContainer.style.display === 'none') {
      pickerContainer.style.display = 'block'; // Show picker
    } else {
      pickerContainer.style.display = 'none'; // Hide picker
    }
  }

  // Function to hide the picker
  function hideEmojiPicker() {
    pickerContainer.style.display = 'none';
  }

  // Event listener to hide picker when clicking outside
  document.addEventListener('click', (event) => {
    if (pickerContainer && !pickerContainer.contains(event.target) && !event.target.matches('#toggleEmojiPickerBtn')) {
      hideEmojiPicker();
    }
  });

  // Attach the toggle function to the button click event
  const toggleBtn = document.getElementById('toggleEmojiPickerBtn');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', toggleEmojiPicker);
  } else {
    console.error('Toggle button element not found.');
  }
}


    let rooms = JSON.parse(localStorage.getItem('rooms')) || [];

    function toggleDropdown() {
  const dropdown = document.querySelector('.dropdown');
  dropdown.classList.toggle('show');
  
  if (dropdown.classList.contains('show')) {
    const dropdownMenu = dropdown.querySelector('.dropdown-menu');
    dropdownMenu.style.maxHeight = dropdownMenu.scrollHeight + "px";
  }
}

	function closeDropdown(event) {
      const dropdown = document.querySelector('.dropdown');
      const dropdownToggle = document.querySelector('.dropdown-toggle');
      
      if (!dropdown.contains(event.target) && event.target !== dropdownToggle) {
        dropdown.classList.remove('show');
      }
    }

    // Add click event listener to the document
    document.addEventListener('click', closeDropdown);
    
    function renderRooms() {
      const dropdownMenu = document.querySelector('.dropdown-menu');
      dropdownMenu.innerHTML = '';

      rooms.sort((a, b) => {
        if (a.color === 'green') return -1;
        if (b.color === 'green') return 1;
        return (b.messageCount || 0) - (a.messageCount || 0);
      });

      rooms.forEach((room, index) => {
        const roomChip = document.createElement('div');
        roomChip.classList.add('room-chip', room.color);
        roomChip.innerHTML = `
          <span class="dot"></span>
          <span class="room-name">${room.name}</span>
          <span class="material-icons delete-btn" onclick="event.stopPropagation(); deleteRoom(${index})">delete</span>
        `;
        roomChip.addEventListener('click', () => openRoom(room.id));
        dropdownMenu.appendChild(roomChip);
      });
    }

	if (document.querySelector('.dropdown').classList.contains('show')) {
      dropdownMenu.style.maxHeight = dropdownMenu.scrollHeight + "px";
    }
    
function openRoom(room) {
  const topic = room.topic || 'No topic'; // Fallback if topic is undefined
  alert(`Room "${room.name}" with topic "${topic}" opened`);
  console.log('Open room:', room.id);
  document.querySelector('.dropdown').classList.remove('show');
}



    function hideClearButton() {
      setTimeout(() => {
        document.querySelector('.chat-input .clear-btn').style.display = 'none';
      }, 100);
    }

function toggleClearButton() {
  const clearBtn = document.querySelector('.chat-input .clear-btn');
  const input = document.querySelector('.chat-input input');
  const markdownRender = document.querySelector('.rendered-markdown');
  
  clearBtn.style.display = input.value.length > 0 ? 'inline-block' : 'none';

  // Update the markdown render
  updateMarkdownRender(input.value);
}

function clearText() {
  const input = document.querySelector('.chat-input input');
  input.value = '';
  toggleClearButton(); // Ensure the clear button is hidden
}

function updateMarkdownRender(text) {
  const markdownRender = document.querySelector('.rendered-markdown');

  // Basic Markdown parsing for **bold** and *italic*
  const renderedText = text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
    .replace(/\*(.*?)\*/g, '<em>$1</em>'); // Italic

  // Render the parsed text in the markdown div
  markdownRender.innerHTML = renderedText;
}
function renderMarkdown() {
  const input = document.getElementById('messageInput');
  const output = document.getElementById('renderedMarkdown');
  let text = input.value;

  // Replace **text** with <b>text</b>
  text = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');

  // Replace *text* with <i>text</i>
  text = text.replace(/\*(.*?)\*/g, '<i>$1</i>');

  // Output the rendered HTML in the overlay
  output.innerHTML = text;

  // Adjust the padding-left of the input based on the width of the rendered text
  const renderedTextWidth = output.offsetWidth;
  input.style.paddingLeft = `${renderedTextWidth + 15}px`; // Add some padding for spacing
}
document.getElementById('messageInput').addEventListener('input', renderMarkdown);

    function addRoomFromUrlParams() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('addRoom') === 'true') {
        const roomTopic = urlParams.get('roomTopic');
        const roomName = urlParams.get('roomName');
        const roomKey = urlParams.get('roomKey');
        const roomExtras = urlParams.get('roomExtras');

        if (roomTopic && roomKey) {
          const newRoom = {
            id: Date.now(),
            topic: roomTopic,
            name: roomName,
            key: roomKey,
            extras: roomExtras || '',
            color: 'blue'
          };

          if (confirm(`Add room: ${roomName}?`)) {
            rooms.push(newRoom);
            localStorage.setItem('rooms', JSON.stringify(rooms));
            renderRooms();
          }
        }
      }
    }

    function deleteRoom(index) {
      if (confirm('Are you sure you want to delete this room?')) {
        rooms.splice(index, 1);
        localStorage.setItem('rooms', JSON.stringify(rooms));
        renderRooms();
      }
    }

    addRoomFromUrlParams();
    renderRooms();
  </script>
