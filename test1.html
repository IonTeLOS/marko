<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metadata Fetcher</title>

</head>
<body>
  <button id="fetch-metadata-btn">Fetch Metadata</button>
  
  <!-- Link to your script file -->
  <script src="https://teloslinux.org/marko/getd.js"></script>
  <script>
    document.getElementById('fetch-metadata-btn').addEventListener('click', async () => {
      try {
        const metadata = await fetchSiteMetadata('https://in.gr')
        console.log(metadata);
        console.log(metadata.title);
      } catch (error) {
        console.error('Error:', error);
      }
    });
  </script>
</body>
</html>
